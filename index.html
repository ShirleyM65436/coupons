<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="description" content="Keep track of your gift cards and their balances. Works offline; all data stays on this device.">
  <title>Gift Cards</title>

  <!-- All paths are RELATIVE (no leading "/") so the app also works from a
       GitHub Pages sub-folder like https://user.github.io/repo/ -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/list.css">
  <link rel="stylesheet" href="css/edit.css">
  <link rel="stylesheet" href="css/detail.css">
  <link rel="stylesheet" href="css/scan.css">
  <link rel="stylesheet" href="css/barcode.css">
  <link rel="stylesheet" href="css/backup.css">

  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="appbar">
    <button id="app-back" class="appbar-btn" type="button" aria-label="Back" title="Back" hidden>
      <span class="icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>
    </button>
    <h1 id="app-title" class="appbar-title">Gift Cards</h1>
    <div id="app-actions" class="appbar-actions"></div>
    <button id="app-install" class="btn btn-small" type="button" hidden>Install</button>
  </header>

  <!-- The current view renders in here (see js/app.js) -->
  <main id="view" class="view"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="empty-state">This app needs JavaScript.</p></noscript>
</body>
</html>
